<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board background — Pianificazione A (raffinato)</title>
<style>
  /* Variante A: stessa struttura dell'originale, rifinita. Barra in blu Adacta con luce in alto,
     colonna con sfumatura fredda e ombra verso l'area di lavoro, filo giallo Adacta (warn). Nessun testo. */
  :root { --bar:#5C88DA; --bar2:#4D79CB; --accent:#FFC000; --side:211px; --head:55px; --gap:8px; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#EEF0F4; }
  .page { position:fixed; inset:0 0 13px 0; background:#fff; }
  .side { position:absolute; left:0; top:0; bottom:0; width:var(--side);
    background:linear-gradient(90deg,#E4E7EC 0%,#EDEFF3 60%,#F6F7F9 100%);
    border-left:4px solid var(--accent); border-top-left-radius:46px 42px;
    box-shadow:inset -1px 0 0 #D5D9E0, 4px 0 14px -6px rgba(0,26,114,.18); z-index:2; }
  .side::before { content:""; position:absolute; left:0; right:0; top:var(--gap); height:var(--head);
    border-bottom:1px solid #D5D9E0; }
  .bar { position:absolute; left:var(--side); right:0; top:var(--gap); height:var(--head);
    background:linear-gradient(180deg,var(--bar) 0%,var(--bar2) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 3px 10px -4px rgba(0,26,114,.35); z-index:1; }
  .page::after { content:""; position:absolute; top:0; right:0; bottom:0; width:3px;
    background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,26,114,.07)); }
  .demo { position: fixed; inset: 0; font: 13px Arial, sans-serif; pointer-events: none; z-index: 9; }
  .demo .t { position: absolute; left: 22px; top: 20px; font-size: 26px; color: #1a1a1a; }
  .demo .m { position: absolute; top: 28px; font-style: normal; font-size: 12px; color: #fff; }
  .demo .s { position: absolute; left: 10px; color: #1a1a1a; font-size: 13px; }
  .demo em { font-style: italic; }
</style></head>
<body>
  <div class="page"><div class="side"></div><div class="bar"></div></div>
<script>
  // Parametri opzionali (colori con %23 al posto di #): bar, bar2, accent, side, head, gap. ?demo=1 mostra i testi segnaposto.
  try {
    var q = new URLSearchParams(location.search), r = document.documentElement.style;
    ["bar","bar2","accent"].forEach(function (k) { if (q.get(k)) r.setProperty("--" + k, q.get(k)); });
    ["side","head","gap"].forEach(function (k) { if (q.get(k)) r.setProperty("--" + k, parseInt(q.get(k), 10) + "px"); });
    if (q.get("demo")) {
      var d = document.createElement("div"); d.className = "demo";
      d.innerHTML = "<b class=\"t\">Pianificazione</b><i class=\"m\" style=\"left:225px\">Configurazioni ▾</i><i class=\"m\" style=\"left:342px\">Pianificazione ▾</i><i class=\"m\" style=\"left:455px\">Iniziative Strategiche ▾</i><i class=\"m\" style=\"left:605px\">Reporting ▾</i><em class=\"s\" style=\"top:538px\">Selezioni Attive</em><span class=\"s\" style=\"top:836px\">Rimuovi Selezioni</span>";
      document.body.appendChild(d);
    }
  } catch (e) {}
</script>
</body></html>
